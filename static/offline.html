<!doctype html><html lang=en><head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Offline</title>
<style>
  html,body{margin:0;height:100%}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:#1b1a17;background:#f6f5f1;padding:24px;text-align:center}
  @media (prefers-color-scheme:dark){body{background:#14130e;color:#f3f1ea}}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#6d6a62;margin:0 0 24px;max-width:28ch}
  button{font:inherit;font-weight:600;color:#fff;background:#0c6b57;border:0;
    border-radius:12px;padding:12px 22px;cursor:pointer}
</style></head><body>
  <h1>You're offline</h1>
  <p>This app needs a connection to load lectures. Check your internet and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body></html>
