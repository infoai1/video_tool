{% extends "base.html" %}
{% block title %}Sign in — Roman Urdu Transcripts{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="notice" style="color:#b3261e">{{ error }}</p>{% endif %}
<form class="fb" method="post" action="{{ url_for('login', next=request.args.get('next','')) }}">
  <label>Username
    <input name="username" autocomplete="username" autofocus required>
  </label>
  <label>Password
    <input name="password" type="password" autocomplete="current-password" required>
  </label>
  <button class="btn" type="submit">Sign in</button>
</form>
{% endblock %}
