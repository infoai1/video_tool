<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Roman Urdu Transcripts</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <div class="login-card">
      <div class="login-brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <span>Roman Urdu Transcripts</span>
      </div>
      <h1 class="login-title">Sign in</h1>
      <p class="login-sub">Maulana Wahiduddin Khan’s lectures, searchable in Roman Urdu.</p>

      {% if error %}<p class="login-error">{{ error }}</p>{% endif %}

      <form class="login-form" method="post" action="{{ url_for('login', next=request.args.get('next','')) }}">
        <label class="login-field">
          <span>Username</span>
          <input name="username" autocomplete="username" autofocus required>
        </label>
        <label class="login-field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn login-submit" type="submit">Sign in</button>
      </form>
    </div>
    <p class="login-foot">CPS International · Centre for Peace and Spirituality</p>
  </main>
</body>
</html>
